services:
  swarm:
    build: .
    env_file: .env
    volumes:
      - workspace:/workspace
    working_dir: /workspace
    environment:
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GITHUB_TOKEN
      - COPILOT_TOKEN
    depends_on:
      health-service:
        condition: service_healthy

  health-service:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./app.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  calculations-api:
    build:
      context: ./calculations-api
    ports:
      - "${CALC_API_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - DATA_FILE=./data/calculations.json
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - calc-data:/app/data
    healthcheck:
      test: ["CMD", "node", "--input-type=commonjs", "-e", "const h=require('http');h.get('http://127.0.0.1:3001/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  notes-api:
    build:
      context: ./notes-api
    ports:
      - "${NOTES_API_PORT:-3002}:3002"
    environment:
      - PORT=3002
      - HOST=0.0.0.0
      - DATA_FILE=./data/notes.json
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - notes-data:/app/data
    healthcheck:
      test: ["CMD", "node", "--input-type=commonjs", "-e", "const h=require('http');h.get('http://127.0.0.1:3002/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      - DEV_PORT=5173
      - API_URL=http://notes-api:3002
    depends_on:
      notes-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--input-type=commonjs", "-e", "const h=require('http');h.get('http://127.0.0.1:5173/',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health}
      POSTGRES_DB: ${POSTGRES_DB:-health_service}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-health}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  workspace:
  pgdata:
  calc-data:
  notes-data:
