# Development override — mounts source code for hot reloading.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Services use --watch / source mounts so edits are reflected immediately
# without rebuilding the image.

services:
  health-service:
    volumes:
      - ./app:/app/app:ro
    environment:
      - LOG_LEVEL=debug

  calculations-api:
    command: ["node", "--watch", "src/server.js"]
    volumes:
      - ./calculations-api/src:/app/src:ro

  notes-api:
    command: ["node", "--watch", "src/server.js"]
    volumes:
      - ./notes-api/src:/app/src:ro

  web:
    volumes:
      - ./web/src:/app/src:ro
      - ./web/index.html:/app/index.html:ro
      - ./web/dev-server.js:/app/dev-server.js:ro

  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
