[project]
name = "health-service"
version = "0.1.0"
description = "FastAPI health endpoint reporting uptime, DB connectivity, and UTC timestamp."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "sqlalchemy>=1.4",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
