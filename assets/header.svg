<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Swarm Orchestrator: independent verification battery for AI-authored code patches">
  <title>Swarm Orchestrator</title>
  <defs>
    <style>
      .line { stroke: #64748b; stroke-width: 1; opacity: 0.55; fill: none; }
      .line-fail { stroke: #dc2626; stroke-width: 1.25; opacity: 0.85; fill: none; stroke-dasharray: 3 3; }
      .probe { fill: none; stroke: #64748b; stroke-width: 1.5; }
      .probe-core { fill: #64748b; }
      .probe-fail { fill: none; stroke: #dc2626; stroke-width: 1.75; }
      .probe-fail-core { fill: #dc2626; }
      .artifact-outer { fill: none; stroke: #2563eb; stroke-width: 2; }
      .artifact-inner { fill: #2563eb; opacity: 0.18; stroke: #2563eb; stroke-width: 1; }
      .title { font: 600 54px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; letter-spacing: -1px; }
      .tagline { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
      .meta { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #64748b; letter-spacing: 0.5px; }
      @media (prefers-color-scheme: dark) {
        .title { fill: #e2e8f0; }
        .tagline { fill: #94a3b8; }
        .meta { fill: #94a3b8; }
        .line { stroke: #94a3b8; }
        .probe { stroke: #94a3b8; }
        .probe-core { fill: #94a3b8; }
        .artifact-outer { stroke: #60a5fa; }
        .artifact-inner { fill: #60a5fa; stroke: #60a5fa; }
      }
    </style>
  </defs>

  <g transform="translate(240,160)">
