    <polygon class="artifact-outer" points="-30,-26 30,-26 50,0 30,26 -30,26 -50,0"/>
    <line class="artifact-outer" x1="-22" y1="-10" x2="22" y2="-10" stroke-width="1.25"/>
    <line class="artifact-outer" x1="-22" y1="0" x2="14" y2="0" stroke-width="1.25"/>
    <line class="artifact-outer" x1="-22" y1="10" x2="22" y2="10" stroke-width="1.25"/>

