      <circle class="probe-fail-core" cx="-115" cy="-90" r="2.6"/>
      <circle class="probe-fail" cx="100" cy="115" r="7"/>
      <circle class="probe-fail-core" cx="100" cy="115" r="2.6"/>
    </g>
  </g>

  <g transform="translate(520,0)">
    <text class="title" x="0" y="158">Swarm Orchestrator</text>
    <text class="tagline" x="2" y="200">Independent verification battery for AI-authored code patches.</text>
    <text class="meta" x="2" y="238">5 LAYERS  ·  HARD GATES + ADVISORY SCORE  ·  SIGNED ATTESTATION</text>
