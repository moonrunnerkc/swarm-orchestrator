      <circle class="probe-core" cx="-180" cy="-100" r="2.2"/>
      <circle class="probe" cx="-200" cy="-30" r="6"/>
      <circle class="probe-core" cx="-200" cy="-30" r="2.2"/>
      <circle class="probe" cx="-180" cy="60" r="6"/>
      <circle class="probe-core" cx="-180" cy="60" r="2.2"/>
      <circle class="probe" cx="-130" cy="115" r="6"/>
      <circle class="probe-core" cx="-130" cy="115" r="2.2"/>
      <circle class="probe" cx="-50" cy="135" r="6"/>
      <circle class="probe-core" cx="-50" cy="135" r="2.2"/>
      <circle class="probe" cx="60" cy="125" r="6"/>
      <circle class="probe-core" cx="60" cy="125" r="2.2"/>
      <circle class="probe" cx="140" cy="80" r="6"/>
      <circle class="probe-core" cx="140" cy="80" r="2.2"/>
      <circle class="probe" cx="170" cy="-10" r="6"/>
      <circle class="probe-core" cx="170" cy="-10" r="2.2"/>
      <circle class="probe" cx="135" cy="-95" r="6"/>
      <circle class="probe-core" cx="135" cy="-95" r="2.2"/>
      <circle class="probe" cx="40" cy="-130" r="6"/>
      <circle class="probe-core" cx="40" cy="-130" r="2.2"/>
      <circle class="probe" cx="-65" cy="-125" r="6"/>
      <circle class="probe-core" cx="-65" cy="-125" r="2.2"/>
