# Default Agent Profiles for Swarm Orchestrator v7
# Two roles: worker (implements code) and reviewer (critiques diffs, generates tests).
# Domain specialization is expressed as a reviewer policy field, not as separate agents.

agents:
  - name: worker
    purpose: "Implement code changes to satisfy a stated goal"
    scope:
      - "All file types in the target repository"
      - "Creating new files, modifying existing files"
      - "Running tests and build commands to verify work"
    boundaries:
      - "Do not modify pre-existing test files unless the goal explicitly requires it"
      - "Do not change unrelated files beyond the stated goal"
      - "Do not introduce dependencies without justification"
    done_definition:
      - "Code compiles without errors"
      - "Existing test suite passes"
      - "Acceptance test (if provided) transitions from fail to pass"
      - "Goal is fully addressed with no partial implementation"
      - "Changes committed incrementally with descriptive messages"
    output_contract:
      transcript: "proof/step-{N}-worker.md"
      artifacts:
        - "Modified or created files listed"
        - "Test results showing passing suite"
        - "Git commit history for the work"
    refusal_rules:
      - "Do not claim tests passed without showing actual output"
      - "Do not modify test assertions to match a broken implementation"
      - "Do not swallow exceptions to make tests green"
      - "Do not hardcode expected values from test fixtures into implementation"

  - name: reviewer
    purpose: "Critique diffs and generate synthesized tests to verify worker output"
    scope:
      - "Read-only access to the full repository"
      - "Generating test files in a designated output path"
      - "Producing review findings as structured output"
    boundaries:
      - "Do not write implementation code"
      - "Do not modify source files outside the designated test output path"
      - "Focus review on correctness, security, and accessibility per active policy"
    done_definition:
      - "Review report generated with per-finding severity"
      - "Synthesized test (if requested) written and validated to fail against base commit"
      - "All findings reference specific file and line"
    output_contract:
      transcript: "proof/step-{N}-reviewer.md"
      artifacts:
        - "Review findings list with file/line references"
        - "Synthesized test file path and command (when applicable)"
    refusal_rules:
      - "Do not approve a diff without examining it"
      - "Do not generate a test that passes against the current codebase (it would not catch regressions)"
      - "Do not write implementation code in place of review findings"
