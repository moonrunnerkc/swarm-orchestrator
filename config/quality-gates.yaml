# Quality gates for generated projects.
# Keep this deterministic. If you relax a gate, do it intentionally.

enabled: true

# This flag is retained for the planned hard-gate path. The current runner
# writes advisory findings and returns passed=true even when individual gates
# report fail.
failOnIssues: true

# When true, swarm can auto-add follow-up steps to fix gate failures.
# These flags are present for the remediation path that will become active
# when quality-gate findings are promoted from advisory to hard failures.
autoAddRefactorStepOnDuplicateBlocks: true
autoAddReadmeTruthStepOnReadmeClaims: true
autoAddScaffoldFixStepOnScaffoldDefaults: true
autoAddConfigFixStepOnHardcodedConfig: true
autoAddAccessibilityFixStepOnAccessibility: true
autoAddTestCoverageStepOnTestCoverage: true

gates:
  scaffoldDefaults:
    enabled: true

  duplicateBlocks:
    enabled: true
    minLines: 12
    maxOccurrences: 2
    maxFindings: 20

  hardcodedConfig:
    enabled: true

  readmeClaims:
    enabled: true

  testIsolation:
    enabled: true

  # Runtime checks run the project's own tests, linter, and security audit.
  # Each sub-check (test, lint, audit) is skipped gracefully when the target
  # project lacks the relevant script, config, or package.json.
  runtimeChecks:
    enabled: true
    retries: 1
    runTests: true
    runLint: true
    runAudit: true
    timeoutMs: 120000

  accessibility:
    enabled: true
    requireSkipLink: true
    requireHeadingHierarchy: true
    requireAriaLabels: true
    requireFocusStyles: true
    requireReducedMotion: true
    requireNoPhantomAssets: true
    requireMetaTags: true
    requireResponsiveCSS: true
    requireColorScheme: true
    requireSemanticHTML: true
    requireImgAlt: true

  testCoverage:
    enabled: true
    entryPointPatterns:
      - '^src/dashboard\.tsx?$'
    minTestAssertions: 1
    requireComponentTests: true

  # D4: Reject modifications to pre-existing test files.
  # Agents should ADD new tests, not weaken existing ones.
  testFileProtection:
    enabled: true
    testFileGlobs:
      - 'tests/**'
      - 'test/**'
      - '**/__tests__/**'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.test.js'
      - '**/*.test.jsx'
      - '**/*.spec.ts'
      - '**/*.spec.js'
      - '**/test_*.py'
      - '**/*_test.py'
    maxFindings: 25
