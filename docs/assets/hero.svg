<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" role="img" aria-label="Swarm Orchestrator — contract-first verification for code changes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b1a"/>
      <stop offset="50%" stop-color="#0d1430"/>
      <stop offset="100%" stop-color="#070b1a"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nodeBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </radialGradient>
    <radialGradient id="nodeViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="40%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </radialGradient>
    <radialGradient id="nodeAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <radialGradient id="nodeRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="40%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <radialGradient id="nodeGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <g opacity="0.35">
    <circle cx="120" cy="60" r="1.5" fill="#60a5fa"/>
    <circle cx="280" cy="40" r="1" fill="#a78bfa"/>
    <circle cx="540" cy="80" r="1.2" fill="#22d3ee"/>
    <circle cx="780" cy="50" r="1" fill="#a78bfa"/>
    <circle cx="980" cy="70" r="1.5" fill="#60a5fa"/>
    <circle cx="1080" cy="40" r="1" fill="#22d3ee"/>
    <circle cx="80" cy="300" r="1.2" fill="#a78bfa"/>
    <circle cx="320" cy="320" r="1" fill="#60a5fa"/>
    <circle cx="660" cy="310" r="1.5" fill="#22d3ee"/>
    <circle cx="900" cy="290" r="1" fill="#a78bfa"/>
    <circle cx="1120" cy="320" r="1.2" fill="#60a5fa"/>
  </g>

  <text x="80" y="120" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#64748b" letter-spacing="6">CONTRACT-FIRST VERIFICATION</text>
  <text x="80" y="190" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="68" font-weight="800" fill="#f8fafc" letter-spacing="-2">swarm</text>
  <text x="240" y="190" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="68" font-weight="300" fill="#cbd5e1" letter-spacing="-1">orchestrator</text>
  <text x="80" y="225" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18" fill="#94a3b8">Compile a goal into typed obligations. Falsify before commit. Log every action.</text>

  <g transform="translate(80,290)">
    <rect x="0" y="0" width="74" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="37" y="17" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="middle">v9.0.0</text>

    <rect x="84" y="0" width="86" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="127" y="17" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">node ≥ 20</text>

    <rect x="180" y="0" width="100" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="230" y="17" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">908 passing</text>
  </g>

  <g transform="translate(720,170)">
    <line x1="20" y1="40" x2="380" y2="40" stroke="url(#flow)" stroke-width="2" filter="url(#softGlow)"/>

    <g transform="translate(0,40)">
      <circle r="22" fill="url(#nodeBlue)" filter="url(#glow)"/>
      <text y="55" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">extract</text>
    </g>
    <g transform="translate(90,40)">
      <circle r="22" fill="url(#nodeViolet)" filter="url(#glow)"/>
      <text y="55" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">session</text>
    </g>
    <g transform="translate(180,40)">
      <circle r="22" fill="url(#nodeAmber)" filter="url(#glow)"/>
      <text y="55" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">predicate</text>
    </g>
    <g transform="translate(270,40)">
      <circle r="22" fill="url(#nodeRose)" filter="url(#glow)"/>
      <text y="55" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">falsify</text>
    </g>
    <g transform="translate(360,40)">
      <circle r="22" fill="url(#nodeGreen)" filter="url(#glow)"/>
      <text y="55" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" text-anchor="middle">verify</text>
    </g>
  </g>

  <g transform="translate(80,40)" opacity="0.7">
    <circle r="3" fill="#22d3ee"/>
    <circle cx="14" r="3" fill="#a78bfa"/>
    <circle cx="28" r="3" fill="#fb7185"/>
  </g>
</svg>
