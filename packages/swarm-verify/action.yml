name: Swarm Verify
description: Rerun a project's declared checks on a pull request's change in a clean checkout and sign the verdict.
author: Brad Kinnard
branding:
  icon: check-square
  color: green
inputs:
  base:
    description: Base ref to verify against. Defaults to the pull request's base branch.
    default: ""
  version:
    description: The swarm-verify version to run.
    default: latest
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Verify
      shell: bash
      env:
        BASE: ${{ inputs.base }}
        VERSION: ${{ inputs.version }}
      run: npx --yes "swarm-verify@${VERSION}" ci ${BASE:+--base "$BASE"}
