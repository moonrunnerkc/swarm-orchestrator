<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Inkwell — a focused browser-based markdown editor with live preview, sidebar notebook, and local persistence." />
    <meta name="theme-color" content="#1f6feb" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231f6feb'/><path d='M9 22 V10 l6 8 6-8 v12' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/></svg>" />
    <title>Inkwell — Markdown Editor</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#editor">Skip to editor</a>

    <header class="topbar">
      <h1 class="brand">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" focusable="false">
            <path d="M5 19 V6 l7 9 7-9 v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
          </svg>
        </span>
        Inkwell
      </h1>
      <div class="topbar__meta" role="status" aria-live="polite" id="statusline">
        Ready
      </div>
      <div class="topbar__actions">
        <button type="button" id="toggle-sidebar" class="icon-btn" aria-label="Toggle notes sidebar" aria-expanded="true" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <button type="button" id="toggle-preview" class="icon-btn" aria-label="Toggle preview pane" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M2 12 C5 6 19 6 22 12 C19 18 5 18 2 12Z" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside id="sidebar" class="sidebar" aria-label="Notes">
        <div class="sidebar__head">
          <h2 class="sidebar__title">Notes</h2>
          <button type="button" id="new-note" class="primary-btn" aria-label="Create new note">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
              <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            New
          </button>
        </div>
        <label class="search">
          <span class="visually-hidden">Search notes</span>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input type="search" id="search" placeholder="Search notes" autocomplete="off" />
        </label>
        <nav aria-label="Saved notes">
          <ul id="note-list" class="note-list" role="list"></ul>
          <p id="empty-state" class="empty-state" hidden>No notes yet. Create one to begin.</p>
        </nav>
      </aside>

      <main class="workspace">
        <section class="editor-pane" aria-label="Editor">
          <label class="title-field">
            <span class="visually-hidden">Note title</span>
            <input type="text" id="title" placeholder="Untitled note" autocomplete="off" maxlength="200" />
          </label>
          <textarea
            id="editor"
            aria-label="Markdown source"
            placeholder="# Start writing…&#10;&#10;Markdown is supported."
            spellcheck="true"
            autocapitalize="sentences"
          ></textarea>
        </section>

        <section class="preview-pane" aria-label="Preview">
          <article id="preview" class="preview" aria-live="polite"></article>
        </section>
      </main>
    </div>

    <footer class="statusbar" aria-label="Document statistics">
      <span id="wordcount">0 words</span>
      <span aria-hidden="true">·</span>
      <span id="charcount">0 characters</span>
      <span aria-hidden="true">·</span>
      <span id="readtime">&lt;1 min read</span>
      <span class="spacer"></span>
      <span id="savestate">Saved</span>
    </footer>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
