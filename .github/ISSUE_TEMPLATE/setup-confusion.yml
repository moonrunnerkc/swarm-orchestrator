name: setup confusion
description: The README, a command or a message left you unsure what to do next.
labels: ["docs", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `swarm --version` or `npx swarm-verify --version`.
      placeholder: swarm-orchestrator 14.4.0 or swarm-verify 1.3.1
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you were trying to do
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it stopped making sense
      description: The command you ran and the output or page you were reading.
      render: text
    validations:
      required: true
  - type: textarea
    id: believed
    attributes:
      label: What you believed at that point
      description: What you expected to happen, and what you tried instead.
