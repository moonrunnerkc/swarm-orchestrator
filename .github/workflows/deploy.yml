name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production
      tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate images exist
        run: |
          TAG="${{ inputs.tag }}"
          for IMAGE in swarm-orchestrator health-service calculations-api notes-api; do
            echo "Checking ${{ env.REGISTRY }}/${{ env.OWNER }}/${IMAGE}:${TAG}..."
            docker pull "${{ env.REGISTRY }}/${{ env.OWNER }}/${IMAGE}:${TAG}"
          done

      - name: Generate deployment config
        run: |
          TAG="${{ inputs.tag }}"
          ENV="${{ inputs.environment }}"
          cat > deploy-config.env <<EOF
          DEPLOY_TAG=${TAG}
          DEPLOY_ENV=${ENV}
          REGISTRY=${{ env.REGISTRY }}/${{ env.OWNER }}
          SWARM_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/swarm-orchestrator:${TAG}
          HEALTH_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/health-service:${TAG}
          CALC_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/calculations-api:${TAG}
          NOTES_IMAGE=${{ env.REGISTRY }}/${{ env.OWNER }}/notes-api:${TAG}
          EOF
          sed -i 's/^[[:space:]]*//' deploy-config.env
          echo "Generated deploy-config.env for ${ENV}:"
          cat deploy-config.env

      - name: Deploy via docker compose
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
        run: |
          echo "==> Deploying tag ${DEPLOY_TAG} to ${{ inputs.environment }}"
          bash scripts/deploy.sh "${DEPLOY_TAG}"

      - name: Post-deploy health checks
        run: |
          echo "==> Running post-deploy health checks"
          bash scripts/healthcheck.sh http://localhost:8000/api/health 10 || true
          echo "Health check completed"

      - name: Summary
        if: always()
        run: |
          echo "### Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ inputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | ${{ inputs.tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${GITHUB_SHA::7} |" >> "$GITHUB_STEP_SUMMARY"
