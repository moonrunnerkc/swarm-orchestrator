name: CD

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override (default: git sha)'
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/swarm-orchestrator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm-publish:
    # Keeps the npm registry in step with tagged releases (it sat at
    # 7.0.0-alpha.0 while the repo shipped 11.x). Publishes only on v* tags,
    # only when the tag matches package.json, and only when NPM_TOKEN is
    # configured; otherwise the job explains what to do and succeeds so CD
    # for the image is never blocked on npm credentials.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG; refusing to publish" >&2
            exit 1
          fi

      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        # prepublishOnly runs the full build + test suite before the tarball
        # is created, so a broken tree cannot reach the registry.
        run: |
          npm ci
          npm publish --provenance --access public

      - name: Skipped (no NPM_TOKEN)
        if: env.NODE_AUTH_TOKEN == ''
        run: |
          echo "NPM_TOKEN secret is not configured; npm publish skipped." >> "$GITHUB_STEP_SUMMARY"
          echo "Add it at Settings > Secrets and variables > Actions to enable registry releases." >> "$GITHUB_STEP_SUMMARY"

  verify:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify swarm-orchestrator image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/swarm-orchestrator:sha-${GITHUB_SHA::7}
          # Override the image's ENTRYPOINT (entrypoint.sh) so the smoke test
          # invokes the CLI directly. entrypoint.sh is the GitHub-Action wrapper
          # that requires INPUT_GOAL / INPUT_PLAN / INPUT_RECIPE env vars and
          # ignores trailing argv — without --entrypoint, `node cli.js --help`
          # gets dropped and the wrapper errors out for missing INPUT_*.
          docker run --rm --entrypoint node ${{ env.REGISTRY }}/${{ env.OWNER }}/swarm-orchestrator:sha-${GITHUB_SHA::7} /app/dist/src/cli.js --help

      - name: Summary
        if: always()
        run: |
          echo "### CD - Image Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| swarm-orchestrator | sha-${GITHUB_SHA::7} |" >> "$GITHUB_STEP_SUMMARY"
