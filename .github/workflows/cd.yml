name: CD

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override (default: git sha)'
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: swarm-orchestrator
            context: .
            dockerfile: Dockerfile
          - image: health-service
            context: .
            dockerfile: app/Dockerfile
          - image: calculations-api
            context: ./calculations-api
            dockerfile: calculations-api/Dockerfile
          - image: notes-api
            context: ./notes-api
            dockerfile: notes-api/Dockerfile
          - image: inkwell
            context: ./web
            dockerfile: web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify swarm-orchestrator image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.OWNER }}/swarm-orchestrator:sha-${GITHUB_SHA::7}
          docker run --rm ${{ env.REGISTRY }}/${{ env.OWNER }}/swarm-orchestrator:sha-${GITHUB_SHA::7} node /app/dist/src/cli.js --help

      - name: Verify health-service image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/health-service:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker run -d --name health-verify -p 8000:8000 "$IMAGE"
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/api/health; then echo " Health-service OK"; break; fi
            if [ "$i" = "15" ]; then echo "Health-service failed"; docker logs health-verify; exit 1; fi
            sleep 2
          done
          docker stop health-verify && docker rm health-verify

      - name: Verify calculations-api image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/calculations-api:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker run -d --name calc-verify -p 3001:3001 "$IMAGE"
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:3001/health; then echo " Calculations-api OK"; break; fi
            if [ "$i" = "15" ]; then echo "Calculations-api failed"; docker logs calc-verify; exit 1; fi
            sleep 2
          done
          docker stop calc-verify && docker rm calc-verify

      - name: Verify notes-api image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/notes-api:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker run -d --name notes-verify -p 3002:3002 "$IMAGE"
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:3002/health; then echo " Notes-api OK"; break; fi
            if [ "$i" = "15" ]; then echo "Notes-api failed"; docker logs notes-verify; exit 1; fi
            sleep 2
          done
          docker stop notes-verify && docker rm notes-verify

      - name: Verify inkwell image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/inkwell:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker run -d --name web-verify -p 5173:5173 "$IMAGE"
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5173/; then echo " Inkwell OK"; break; fi
            if [ "$i" = "15" ]; then echo "Inkwell failed"; docker logs web-verify; exit 1; fi
            sleep 2
          done
          docker stop web-verify && docker rm web-verify

      - name: Summary
        if: always()
        run: |
          echo "### CD - Image Verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| swarm-orchestrator | sha-${GITHUB_SHA::7} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| health-service | sha-${GITHUB_SHA::7} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| calculations-api | sha-${GITHUB_SHA::7} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| notes-api | sha-${GITHUB_SHA::7} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| inkwell | sha-${GITHUB_SHA::7} |" >> "$GITHUB_STEP_SUMMARY"
