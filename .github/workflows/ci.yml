name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Test
      run: |
        set -o pipefail
        npm run test:ci 2>&1 | tee test-output.txt

    - name: Publish test summary
      if: always() && matrix.node-version == 22
      run: |
        PASS_COUNT=$(grep -oP '\d+(?= passing)' test-output.txt || echo '0')
        FAIL_COUNT=$(grep -oP '\d+(?= failing)' test-output.txt || echo '0')
        PEND_COUNT=$(grep -oP '\d+(?= pending)' test-output.txt || echo '0')
        echo "### Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Passing | $PASS_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| Failing | $FAIL_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| Pending | $PEND_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Node.js ${{ matrix.node-version }} on ubuntu-latest" >> $GITHUB_STEP_SUMMARY

    - name: Upload test output
      if: always() && matrix.node-version == 22
      uses: actions/upload-artifact@v4
      with:
        name: test-output-node${{ matrix.node-version }}
        path: test-output.txt
        retention-days: 7

    - name: Run quality gates on self
      if: matrix.node-version == 22
      run: |
        rm -f test-output.txt
        node dist/src/cli.js gates .

  subproject-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Cache subproject dependencies
      uses: actions/cache@v4
      with:
        path: |
          calculations-api/node_modules
          notes-api/node_modules
          calculator/node_modules
          logtail/node_modules
          tictactoe/node_modules
          web/node_modules
        key: subprojects-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('calculations-api/package-lock.json', 'notes-api/package-lock.json', 'calculator/package-lock.json', 'logtail/package-lock.json', 'tictactoe/package-lock.json', 'web/package-lock.json') }}
        restore-keys: |
          subprojects-${{ runner.os }}-node${{ matrix.node-version }}-

    - name: Install subproject dependencies
      run: |
        (cd calculations-api && npm ci)
        (cd notes-api && npm ci)

    - name: Test calculations-api
      working-directory: calculations-api
      run: npm test

    - name: Test calculator
      working-directory: calculator
      run: npm test

    - name: Test logtail
      working-directory: logtail
      run: npm test

    - name: Test notes-api
      working-directory: notes-api
      run: npm test

    - name: Test web
      working-directory: web
      run: npm test

    - name: Test tictactoe
      working-directory: tictactoe
      run: npm test

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: pip install ".[dev]"

    - name: Run tests
      run: pytest app/tests/ -v

    - name: Publish Python test summary
      if: always() && matrix.python-version == '3.12'
      run: |
        echo "### Python Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Python ${{ matrix.python-version }} on ubuntu-latest" >> $GITHUB_STEP_SUMMARY

  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Audit root dependencies
      run: npm audit --audit-level=critical --omit=dev

    - name: Audit calculations-api dependencies
      working-directory: calculations-api
      run: |
        npm ci
        npm audit --audit-level=critical --omit=dev

    - name: Audit notes-api dependencies
      working-directory: notes-api
      run: |
        npm ci
        npm audit --audit-level=critical --omit=dev

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Audit Python dependencies
      run: |
        pip install ".[dev]" pip-audit
        pip-audit

    - name: Summary
      if: always()
      run: |
        echo "### Security Audit" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Scanned: root npm, calculations-api, notes-api, Python (pip)" >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, subproject-tests, python-tests]
    steps:
    - uses: actions/checkout@v4

    - name: Build swarm-orchestrator image
      run: docker build -t swarm-orchestrator:ci .

    - name: Verify swarm container starts
      run: docker run --rm swarm-orchestrator:ci node /app/dist/src/cli.js --help || true

    - name: Build health-service image
      run: docker build -t health-service:ci -f app/Dockerfile .

    - name: Verify health-service container starts
      run: |
        docker run -d --name health-test -p 8000:8000 health-service:ci
        for i in $(seq 1 10); do
          if curl -sf http://127.0.0.1:8000/api/health; then echo " Health-service is healthy"; break; fi
          if [ "$i" = "10" ]; then echo "Health-service failed to start"; docker logs health-test; exit 1; fi
          sleep 1
        done
        docker stop health-test && docker rm health-test

    - name: Build calculations-api image
      run: docker build -t calculations-api:ci ./calculations-api

    - name: Verify calculations-api container starts
      run: |
        docker run -d --name calc-test -p 3001:3001 calculations-api:ci
        for i in $(seq 1 10); do
          if curl -sf http://127.0.0.1:3001/health; then echo " Calculations-api is healthy"; break; fi
          if [ "$i" = "10" ]; then echo "Calculations-api failed to start"; docker logs calc-test; exit 1; fi
          sleep 1
        done
        docker stop calc-test && docker rm calc-test

    - name: Build notes-api image
      run: docker build -t notes-api:ci ./notes-api

    - name: Verify notes-api container starts
      run: |
        docker run -d --name notes-test -p 3002:3002 notes-api:ci
        for i in $(seq 1 10); do
          if curl -sf http://127.0.0.1:3002/health; then echo " Notes-api is healthy"; break; fi
          if [ "$i" = "10" ]; then echo "Notes-api failed to start"; docker logs notes-test; exit 1; fi
          sleep 1
        done
        docker stop notes-test && docker rm notes-test

    - name: Build web (inkwell) image
      run: docker build -t inkwell:ci ./web

    - name: Verify web container starts
      run: |
        docker run -d --name web-test -p 5173:5173 -e API_URL=http://127.0.0.1:3002 inkwell:ci
        for i in $(seq 1 10); do
          if curl -sf http://127.0.0.1:5173/; then echo " Web (inkwell) is healthy"; break; fi
          if [ "$i" = "10" ]; then echo "Web failed to start"; docker logs web-test; exit 1; fi
          sleep 1
        done
        docker stop web-test && docker rm web-test
