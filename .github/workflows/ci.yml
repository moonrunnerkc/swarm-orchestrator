name: ci

on:
  push:
    branches: [main, v13-main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The doc-path check resolves released changelog sections against their tags.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The worktree's Python environment is built with uv, and its tests lock and sync a project.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.13"
          enable-cache: false
      # One command, the same one a release runs, so green CI means a releasable tree.
      - run: npm run gates
