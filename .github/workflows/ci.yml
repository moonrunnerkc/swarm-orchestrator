name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Lint
      run: npm run lint

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        fetch-depth: 2

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.11'

    - name: Install pytest
      # The synthesizer's framework-aware preflight runs `python3 -m pytest
      # --collect-only` against synthesized Python candidates. Without
      # pytest on PATH, every Python candidate is rejected with a
      # collection error and the related test-synthesizer specs (Django
      # placement, pytest flatten, .venv rewrite, --collect-only reject)
      # all fail. ubuntu-latest does not include pytest by default. The
      # positive merge-safety gate's pytest runner is exercised here too.
      run: pip install pytest

    - name: Setup Go
      # The positive merge-safety gate's Go runner (go build + go test) is
      # exercised by the live polyglot gate tests, which skip when `go` is
      # not on PATH. ubuntu-latest ships Go, but pin the toolchain so the
      # gated Go tests actually run in CI rather than silently skipping.
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.21'

    - name: Configure git identity
      # Production code paths that spawn git directly (e.g.
      # attachAttestationNote -> git notes add) need an author identity.
      # ubuntu-latest CI runners ship with empty global git config, which
      # makes those paths fail with "fatal: empty ident name". The
      # battery-runner tests set a per-repo identity in their fixtures,
      # but a global fallback is the safer floor for any future test.
      run: |
        git config --global user.email "ci@swarm-orchestrator.local"
        git config --global user.name "swarm-ci"

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Test
      run: |
        set -o pipefail
        npm run test:ci 2>&1 | tee test-output.txt

    - name: Check detector promotion policy is fresh
      if: matrix.node-version == 22
      # The committed promotion policy must equal a fresh recompute from
      # the scores snapshot, so a detector cannot be hand-promoted into
      # the blocking gate without the measured precision to back it.
      run: npm run promotions:check

    - name: Check block-trigger eligibility policy is fresh
      if: matrix.node-version == 22
      # Same discipline for the verifiable-evidence gate: the committed
      # block-eligibility policy must equal a fresh recompute from the
      # trigger calibration, and the threshold cannot be tuned below the
      # floor. README points at this check; keep it wired.
      run: npm run block-policy:check

    - name: Check ground-truth baseline holds
      if: matrix.node-version == 22
      # The frozen v12 GROUND TRUTH (oracle recall, real-corpus precision,
      # EG-viable fraction) must be held or beaten by every change. Fails if
      # a live metric regressed below its committed floor, or if the
      # reference floors were hand-edited out of step with the code
      # constants. See benchmarks/baselines/ground-truth-v12.json.
      run: npm run baseline:check

    - name: Check corroborated-gate precision is fresh and honest
      if: matrix.node-version == 22
      # The committed corroborated-gate precision must equal a fresh recompute
      # from the EG-viable corroborated TP/FP and the outcome-labeled viability
      # screen, and it must never claim the gate is ready on undefined n (a
      # slice with no outcome-bad PR). This closes the v12 measurement loop:
      # the corroborated structural gate cannot be lit without the measured
      # precision to back it. See benchmarks/real-corpus/corroborated-gate-precision.json.
      run: npm run corroborated-gate:check

    - name: Check README badges are fresh
      if: matrix.node-version == 22
      # The README badge row is generated from the sources it cites (package.json
      # version, the CI-guarded oracle baseline, the real-PR reports), so it cannot
      # lag a version bump. A stale row (e.g. a version badge behind package.json)
      # fails here; regenerate with `npm run badges:regen` and commit.
      run: node dist/scripts/badges/regen-badges.js --check

    - name: Publish test summary
      if: always() && matrix.node-version == 22
      run: |
        PASS_COUNT=$(grep -oP '\d+(?= passing)' test-output.txt || echo '0')
        FAIL_COUNT=$(grep -oP '\d+(?= failing)' test-output.txt || echo '0')
        PEND_COUNT=$(grep -oP '\d+(?= pending)' test-output.txt || echo '0')
        echo "### Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Passing | $PASS_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| Failing | $FAIL_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "| Pending | $PEND_COUNT |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Node.js ${{ matrix.node-version }} on ubuntu-latest" >> $GITHUB_STEP_SUMMARY

    - name: Upload test output
      if: always() && matrix.node-version == 22
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-output-node${{ matrix.node-version }}
        path: test-output.txt
        retention-days: 7

  loc-budget:
    # Enforces the post-Phase-6 LOC ceiling on src/ on every PR.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Run LOC budget gate
      run: bash scripts/loc-budget-gate.sh

  security-audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: 'npm'

    - name: Audit dependencies
      run: npm audit --audit-level=critical --omit=dev

    - name: Summary
      if: always()
      run: |
        echo "### Security Audit" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Scanned: root npm (production dependencies)" >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Build swarm-orchestrator image
      run: docker build -t swarm-orchestrator:ci .

    - name: Verify swarm container starts
      run: docker run --rm swarm-orchestrator:ci node /app/dist/src/cli.js --help || true
