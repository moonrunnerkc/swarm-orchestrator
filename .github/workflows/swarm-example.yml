# Example: Running Swarm Orchestrator from source in GitHub Actions.
# The Docker action image does not currently include agent CLIs, so this
# workflow builds the CLI in the runner where the selected agent CLI is installed.
name: AI Swarm - Add Tests
on:
  workflow_dispatch:
    inputs:
      goal:
        description: 'What should the swarm build or fix?'
        required: true
        default: 'Add unit tests for all untested modules'
      tool:
        description: 'CLI agent to use'
        required: false
        default: 'codex'
        type: choice
        options:
          - copilot
          - claude-code
          - codex
      model:
        description: 'Model override (leave blank for default)'
        required: false

jobs:
  swarm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Swarm Orchestrator
        run: |
          npm install
          npm run build

      # Install the agent CLI you chose
      - name: Install Copilot CLI
        if: inputs.tool == 'copilot'
        run: npm install -g @github/copilot

      - name: Install Claude Code
        if: inputs.tool == 'claude-code'
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Codex
        if: inputs.tool == 'codex'
        run: npm install -g @openai/codex

      - name: Set up GitHub CLI for Copilot
        if: inputs.tool == 'copilot'
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Swarm Orchestrator from local build
        id: swarm
        run: |
          CMD=(node dist/src/cli.js run --goal "$GOAL" --tool "$TOOL" --pr review --yes)
          if [ -n "$MODEL" ]; then
            CMD+=(--model "$MODEL")
          fi
          "${CMD[@]}"
        env:
          GOAL: ${{ inputs.goal }}
          TOOL: ${{ inputs.tool }}
          MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show result
        run: |
          if [ -f /tmp/swarm-result.json ]; then
            cat /tmp/swarm-result.json
          else
            echo "No /tmp/swarm-result.json was written"
          fi
