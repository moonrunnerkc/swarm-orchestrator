name: PR Audit
# Self-audit: every PR opened against this repo runs through swarm-audit
# so the project's own commits are subject to the same detector verdict
# the tool publishes for outside use.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 22: the execution-grounded sandbox runs the PR's tests under the
          # ambient toolchain, and the corpus / dogfood suites target Node 22.
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Run swarm audit
        id: audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node dist/src/cli.js audit "${GITHUB_REPOSITORY}#${{ github.event.pull_request.number }}" \
            --mode gate \
            --output json \
            --emit-aibom cyclonedx-ml \
            > audit.json
          AUDIT_EXIT=$?
          set -e
          LEDGER=$(ls -t .swarm/ledger/audit-*.jsonl 2>/dev/null | head -n1 || true)
          echo "ledger=$LEDGER" >> "$GITHUB_OUTPUT"
          echo "exit=$AUDIT_EXIT" >> "$GITHUB_OUTPUT"
      - name: Render and post comment
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEDGER: ${{ steps.audit.outputs.ledger }}
        run: |
          PAYLOAD=$(node -e "
            const r = require('./audit.json');
            const { renderPrComment } = require('./dist/src/audit/report-comment');
            // r carries mode and blockingTriggers (emitOutput's json shape), so the
            // posted comment shows the gate framing and the block-trigger section
            // (verdict, controls table, reproduce command) when a trigger gates.
            const body = renderPrComment(r, {
              ledgerUrl: process.env.LEDGER,
              mode: r.mode,
              blockTriggers: r.blockingTriggers || [],
            });
            process.stdout.write(JSON.stringify({ body }));
          ")
          curl -sS -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            > /dev/null
      - name: Upload AI-BOM artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aibom
          path: .swarm/aibom/
          if-no-files-found: ignore
      - name: Upload audit ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-ledger
          path: .swarm/ledger/audit-*.jsonl
          if-no-files-found: ignore
      - name: Fail on blocking findings
        if: ${{ steps.audit.outputs.exit != '0' }}
        run: |
          echo "swarm-audit blocked this PR. See the comment above for details." >&2
          exit 1
