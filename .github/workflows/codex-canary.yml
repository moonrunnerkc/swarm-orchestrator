name: Codex CLI Canary

# Weekly canary against the unpinned latest @openai/codex CLI. The
# adapter (src/falsification/adapters/profiles/codex.ts) is bound to a specific CLI
# grammar (flag order, model semantics, footer format); previous releases
# have broken the adapter five separate times. This job is the
# "weekly canary against unpinned versions" prescribed by
# docs/adapter-integration.md "Adapter version drift" risk-register entry.
#
# Failures open a labelled issue rather than block CI on regular PRs.
# Manual dispatch is supported so an operator can verify the canary
# without waiting for Monday.

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC
  workflow_dispatch:

jobs:
  codex-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      SWARM_E2E_CODEX: '1'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check for OPENAI_API_KEY
        id: secret_check
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::warning::OPENAI_API_KEY secret is not set; canary cannot run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secret_check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - if: steps.secret_check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install codex CLI (latest)
        if: steps.secret_check.outputs.skip != 'true'
        run: npm install -g @openai/codex

      - name: Print codex version
        if: steps.secret_check.outputs.skip != 'true'
        run: codex --version

      - name: Install dependencies
        if: steps.secret_check.outputs.skip != 'true'
        run: npm ci

      - name: Build
        if: steps.secret_check.outputs.skip != 'true'
        run: npm run build

      - name: Run codex integration test
        id: integration
        if: steps.secret_check.outputs.skip != 'true'
        run: |
          ./node_modules/.bin/mocha \
            'dist/test/falsification/adapters/codex/codex-falsifier.integration.test.js'

      - name: Open issue on canary failure
        if: failure() && github.event_name == 'schedule' && steps.integration.conclusion == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Codex CLI canary failed (${today})`,
              body: [
                `The weekly codex canary failed against the latest @openai/codex CLI.`,
                ``,
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Likely cause: a breaking change in the codex CLI grammar or output`,
                `format. Inspect the failed step's logs and update the adapter under`,
                `\`src/falsification/adapters/profiles/codex.ts\` to match.`,
              ].join('\n'),
              labels: ['adapter-drift', 'codex'],
            });
