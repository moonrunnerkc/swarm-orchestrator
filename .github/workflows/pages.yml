name: Pages

# Publishes the leaderboard dashboard at
# https://moonrunnerkc.github.io/swarm-orchestrator/docs/leaderboard/.
# The score.js fetches `../../benchmarks/real-corpus/scores/latest.json`
# at runtime, so the deployed artifact mirrors the repo layout: docs/
# and benchmarks/ side by side at the Pages root.
#
# This is the sole leaderboard deployer. The build job regenerates
# docs/leaderboard/data.json (corpus:generate + leaderboard) into the
# workspace before staging, so every deploy serves freshly computed
# numbers without committing derived data back to a protected main. The
# weekly schedule replaces the old leaderboard-refresh workflow, which
# pushed the regenerated data to main and could not: the repository
# ruleset blocks a bot push to a protected ref, so that job failed every
# week. Deploying the artifact directly needs no push.
#
# Pages must be enabled in repo settings with "GitHub Actions" as the
# source. The default GITHUB_TOKEN can't auto-enable Pages on
# repos whose workflow-permission settings forbid it, so the first
# job here probes the API and bails cleanly when Pages isn't enabled
# yet (keeps CI green; a maintainer flips the toggle once).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'benchmarks/real-corpus/scores/**'
      - 'benchmarks/real-corpus/promotions.json'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '0 13 * * MON'  # 13:00 UTC every Monday: weekly leaderboard refresh
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages is enabled; will build and deploy."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not enabled on this repository. Enable it in Settings → Pages → Source: GitHub Actions, then re-run this workflow."
          fi

  build:
    needs: probe
    if: needs.probe.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      # Regenerate the leaderboard data into the workspace so the deployed
      # docs/leaderboard/data.json reflects the current corpus and scoring,
      # not a committed snapshot. corpus:generate writes the synthetic corpus
      # that the scorer reads; leaderboard (benchmarks/leaderboard/score.js)
      # writes docs/leaderboard/data.json. Both are deterministic and offline.
      - run: npm run corpus:generate
      - run: npm run leaderboard
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Stage Pages artifact
        run: |
          mkdir -p _site/docs _site/benchmarks
          cp -R docs/. _site/docs/
          # Only the score / promotion data the dashboard reads is
          # mirrored; full benchmarks/ tree is large and irrelevant
          # to the page.
          mkdir -p _site/benchmarks/real-corpus/scores
          cp benchmarks/real-corpus/scores/latest.json _site/benchmarks/real-corpus/scores/
          cp benchmarks/real-corpus/promotions.json _site/benchmarks/real-corpus/
          # Convenience landing page at the Pages root so the bare URL
          # redirects into the dashboard.
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>swarm-orchestrator</title>
          <meta http-equiv="refresh" content="0; url=./docs/leaderboard/">
          <link rel="canonical" href="./docs/leaderboard/">
          HTML
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: [probe, build]
    if: needs.probe.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
