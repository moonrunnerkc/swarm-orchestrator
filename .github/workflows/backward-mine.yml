name: Backward mine confirmed-bad

# Nightly backward mine of outcome-confirmed-bad agent commits. Starts from
# revert markers in the wild, walks back to the reverted agent commit, confirms
# the outcome with the same findOutcomeEvidence the corpus labeler uses, appends
# to the confirmed-bad backward corpus, and uploads the recomputed artifact for
# a maintainer to fold. Bounded by a hard API-call budget and a wall-clock cap
# so a run cannot run away.
#
# The grown corpus is uploaded as an artifact, not pushed: main is a protected
# ref and the github-actions token cannot bypass it, so a maintainer reviews the
# mined entries (spot-checking each against its evidence SHAs) and folds them in,
# the same review-then-fold contract eg-viable-measure.yml uses. Nothing reaches
# main without going through the normal verified path.
#
# Confirmations persist across nights through a checkpoint restored and saved
# with actions/cache, so the artifact is the accumulated, deduped corpus rather
# than a from-scratch rediscovery whose entries evaporate when the run ends.

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC nightly
  workflow_dispatch:
    inputs:
      apiBudget:
        description: 'Max GitHub API calls'
        default: '1500'
      limit:
        description: 'Max entries to mine this run'
        default: '50'

permissions:
  contents: read

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Restore the confirmation checkpoint
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .swarm/backward-mine/checkpoint.json
          key: backward-mine-checkpoint-${{ github.run_id }}
          restore-keys: |
            backward-mine-checkpoint-
      - name: Backward mine (capped)
        # Secrets reach the step only through the env block, never via with: or args.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node dist/scripts/real-prs/mine-backward.js \
            --api-budget "${{ github.event.inputs.apiBudget || '1500' }}" \
            --wall-clock-ms 2400000 \
            --limit "${{ github.event.inputs.limit || '50' }}" \
            --months 18 \
            --checkpoint .swarm/backward-mine/checkpoint.json
      - name: Save the confirmation checkpoint
        # Cache keys are immutable, so each run saves under its own run id and
        # the next run restores the newest via the restore-keys prefix. Skipped
        # when the mine died before writing a checkpoint (nothing to save).
        if: always() && hashFiles('.swarm/backward-mine/checkpoint.json') != ''
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .swarm/backward-mine/checkpoint.json
          key: backward-mine-checkpoint-${{ github.run_id }}
      - name: Report the mine result
        run: |
          if git diff --quiet -- benchmarks/real-prs/agent-corpus/confirmed-bad-backward.json; then
            echo "no change to the backward corpus this run"
          else
            echo "backward corpus changed; uploading for maintainer review and fold"
            git --no-pager diff --stat -- benchmarks/real-prs/agent-corpus/confirmed-bad-backward.json
          fi
      - name: Upload the grown corpus for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: confirmed-bad-backward
          path: benchmarks/real-prs/agent-corpus/confirmed-bad-backward.json
          if-no-files-found: warn
