name: nightly-eval

# The next ten unrun tasks per arm from the frozen lists, on the self-hosted runner labeled
# swarm-eval (docs/eval.md says how to register it). The rows go into the results store under
# eval/results/, docs/results.md is rewritten from the store, and both are committed.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: [self-hosted, swarm-eval]
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The ruleset on every branch only lets a bypass actor push; GITHUB_TOKEN is not one.
          token: ${{ secrets.SWARM_EVAL_PUSH_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Three-arm evaluation
        env:
          DOCKER_CONTEXT: colima-swarm-eval
        run: node eval/run.mjs --next 10
      - name: Commit the results
        run: |
          git config user.name "swarm-eval"
          git config user.email "swarm-eval@users.noreply.github.com"
          git add eval/results docs/results.md
          git diff --cached --quiet && exit 0
          git commit -m "Record the nightly evaluation run"
          git pull --rebase
          git push
          cat docs/results.md >> "$GITHUB_STEP_SUMMARY"
