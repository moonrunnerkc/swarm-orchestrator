name: gates

on: push

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so the corpus-replay suite can reach the falsification corpus on
          # main; a depth-1 checkout leaves it unreachable and those tests self-skip.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gates
      # The 8-harness smoke, cheap enough for every push. Without it a harness that
      # stopped loading, or one built against a stale .swarm/fuzz-build, is only found
      # when somebody runs fuzz:build locally, and it reports exactly what a clean run
      # reports until then.
      - run: npm run fuzz:build
