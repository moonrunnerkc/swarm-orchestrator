name: gates

# Pull requests as well as pushes. A branch protected by a check that never runs on the pull
# request is protected by nothing: the review happens on the pull request, and that is where
# the result has to be.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every arm runs, so one platform failing still reports the others. A defect that only
      # shows on macOS is worth seeing on the same run as the one that does not.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so the corpus-replay suite can reach the falsification corpus on
          # main; a depth-1 checkout leaves it unreachable and those tests self-skip.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # CLAUDE.md and AGENTS.md carry one invariant block for two readers, and it has
      # drifted before. Cheap, and it runs before the suite so the failure is legible.
      - run: node scripts/check-invariant-drift.mjs
      # A document pointing at a file that is not there is the defect the 08-18 run found in
      # redteam/pass5. A reader following the pointer discovers it; nothing else does.
      - run: node scripts/check-doc-paths.mjs
      # Bulk evidence blobs were the whole of this repository's weight. Removing them once fixed
      # a number; a check that fails when they come back fixes the cause.
      - run: node scripts/check-repo-weight.mjs
      # A bundle a document calls verified must verify from a clone. This caught nothing for a
      # while because nothing checked it, and 47 of 51 bundles had stopped verifying.
      - run: node scripts/check-cited-bundles-verify.mjs
      - run: npm run gates
      # The 8-harness smoke, cheap enough for every push. Without it a harness that
      # stopped loading, or one built against a stale .swarm/fuzz-build, is only found
      # when somebody runs fuzz:build locally, and it reports exactly what a clean run
      # reports until then.
      - run: npm run fuzz:build

  packaged:
    # What a user installs, rather than what the working tree holds. A file left out of `files`
    # in package.json is present here and missing everywhere else, so the command that reads it
    # works in the repository and fails on the machine that installed the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/check-packed-cli.mjs
