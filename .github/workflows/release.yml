name: release

# A v* tag publishes swarm-orchestrator. swarm-verify is released from its own repository.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  # Trusted publishing: npm takes this job's OIDC token in place of a stored npm token, and signs
  # the provenance statement against this workflow and commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          # No dependency cache in a release build, as npm's trusted-publishing example has it.
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later (docs.npmjs.com/trusted-publishers).
      - name: Check npm meets the trusted-publishing minimum
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))) process.exit(0);
            console.error(`npm ${process.argv[1]} is older than 11.5.1, which trusted publishing needs`);
            process.exit(1);
          ' "$(npm --version)"
      - run: npm ci
      # The worktree's Python environment is built with uv, and its tests lock and sync a project.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.13"
          enable-cache: false
      - run: npm run gates
      - name: Check the tag matches the package version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $PKG; refusing to publish" >&2
            exit 1
          fi
      - name: Check the verifier dependency is a release, not a candidate
        run: |
          DEP="$(node -p "require('./package.json').dependencies['swarm-verify']")"
          case "$DEP" in
            *-*) echo "swarm-verify $DEP is a prerelease; pin a released version before publishing" >&2; exit 1 ;;
          esac
      - name: Publish
        run: npm publish --provenance --access public
