name: release

# A tag publishes one package: v* is swarm-orchestrator, swarm-verify-v* is swarm-verify.
on:
  push:
    tags:
      - "v*"
      - "swarm-verify-v*"

permissions:
  contents: read
  # npm provenance signs the tarball against this workflow and commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run gates
      - name: Choose the package the tag names
        id: package
        run: |
          case "$GITHUB_REF_NAME" in
            swarm-verify-v*) echo "dir=packages/swarm-verify" >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#swarm-verify-v}" >> "$GITHUB_OUTPUT" ;;
            v*) echo "dir=." >> "$GITHUB_OUTPUT"; echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Check the tag matches the package version
        env:
          DIR: ${{ steps.package.outputs.dir }}
          TAG_VERSION: ${{ steps.package.outputs.version }}
        run: |
          PKG="$(node -p "require('./$DIR/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG" ]; then
            echo "tag version $TAG_VERSION does not match $DIR/package.json $PKG; refusing to publish" >&2
            exit 1
          fi
      - name: Publish
        working-directory: ${{ steps.package.outputs.dir }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
