name: action-controls
on:
  push:
    branches: [v13-main]
  workflow_dispatch:
    inputs:
      distribution-ref:
        description: 'Exact swarm-verify distribution commit to validate; empty builds source'
        required: false
        type: string
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  controls:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate: [good, bad]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the published Action at the requested commit
        if: inputs.distribution-ref != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: moonrunnerkc/swarm-verify
          ref: ${{ inputs.distribution-ref }}
          path: published
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: docker pull node:24-bookworm
      - id: fixture
        run: node trusted/scripts/action-fixture.mjs '${{ matrix.candidate }}'
      - uses: ./trusted/packages/swarm-verify
        if: inputs.distribution-ref == ''
        id: verify
        continue-on-error: true
        with:
          workspace: ${{ steps.fixture.outputs.workspace }}
          head: ${{ steps.fixture.outputs.head }}
          base: ${{ steps.fixture.outputs.base }}
          goal-contract: ${{ steps.fixture.outputs.contract }}
      - uses: ./published
        if: inputs.distribution-ref != ''
        id: published
        continue-on-error: true
        with:
          workspace: ${{ steps.fixture.outputs.workspace }}
          head: ${{ steps.fixture.outputs.head }}
          base: ${{ steps.fixture.outputs.base }}
          goal-contract: ${{ steps.fixture.outputs.contract }}
      - name: Assert the original verifier outcome
        if: always()
        env:
          SWARM_REPORT: ${{ steps.verify.outputs.report || steps.published.outputs.report }}
          SWARM_STATUS: ${{ steps.verify.outputs.status || steps.published.outputs.status }}
          SWARM_OUTCOME: ${{ inputs.distribution-ref != '' && steps.published.outcome || steps.verify.outcome }}
          SWARM_EVIDENCE: ${{ steps.verify.outputs.evidence || steps.published.outputs.evidence }}
          SWARM_HEAD: ${{ steps.fixture.outputs.head }}
          SWARM_RESULT: ${{ steps.verify.outputs.result || steps.published.outputs.result }}
          SWARM_ATTESTATION: ${{ steps.verify.outputs.attestation || steps.published.outputs.attestation }}
          SWARM_VERDICT: ${{ steps.verify.outputs.verdict || steps.published.outputs.verdict }}
          SWARM_COMMENT: ${{ steps.verify.outputs.comment || steps.published.outputs.comment }}
        run: node trusted/scripts/action-fixture.mjs assert '${{ matrix.candidate }}'
